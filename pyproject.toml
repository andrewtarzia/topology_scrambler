[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "topology_scrambler"
maintainers = [{ name = "Andrew Tarzia", email = "andrew.tarzia@gmail.com" }]
dependencies = ["CGExplore"]
requires-python = ">=3.11"
dynamic = ["version"]
readme = "README.md"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pip-tools",
    # TODO: Remove pin when https://github.com/TvoroG/pytest-lazy-fixture/issues/65 is resolved.
    # pytest-lazy-fixture 0.6.0 is incompatible with pytest 8.0.0
    "pytest<8",
    "pytest-datadir",
    "pytest-lazy-fixture",
    "pytest-cov",
]

[project.scripts]
all_database_analysis = "model_enumeration.all_database_analysis:main"
analyse_graphs = "model_enumeration.analyse_graphs:main"
angle_hunter = "model_enumeration.angle_hunter:main"
plot_geometrical = "model_enumeration.plot_geometrical:main"
plot_li2023_maps = "model_enumeration.plot_li2023_maps:main"
plot_sudan2021_maps = "model_enumeration.plot_sudan2021_maps:main"
environment_hunter = "model_enumeration.environment_hunter:main"
mgen_crest_analysis = "model_enumeration.mgen_crest_analysis:main"
mgen_generation = "model_enumeration.mgen_generation:main"
mgen_genetic = "model_enumeration.mgen_genetic:main"
mgen_scan = "model_enumeration.mgen_scan:main"
mgen_steric = "model_enumeration.mgen_steric:main"
validation_mnl2n = "model_enumeration.validation_mnl2n:main"


[project.urls]
github = "https://github.com/andrewtarzia/topology_scrambler"

[tool.setuptools_scm]
write_to = "src/_version.py"

[tool.setuptools.packages.find]
where = [
    # list of folders that contain the packages (["."] by default)
    "src",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "COM812", "ISC001", "FBT001", "FBT002"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.mypy]
show_error_codes = true
implicit_optional = false
warn_no_return = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unreachable = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "scipy.*",
    "pytest_lazyfixture.*",
    "pathos.*",
    "matplotlib.*",
    "pandas.*",
    "seaborn.*",
    "mchammer.*",
    "spindry.*",
    "pymongo.*",
    "vabene.*",
    "setuptools.*",
    "stk.*",
    "networkx.*",
    "openbabel.*",
    "MDAnalysis.*",
    "atomlite.*",
]
ignore_missing_imports = true
